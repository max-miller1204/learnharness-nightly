name: PR preview publish

# Publishes a finished PR preview build (pr-preview.yml) as the PR's
# `preview-pr-<N>` prerelease and comments `lh preview <N>` on the PR; also
# deletes the previews of PRs that are no longer open. Design:
# docs/specs/pr-previews.md.
#
# Trusted half: workflow_run always runs main's copy of this file. It never
# checks out or runs PR code; the build's files are data (exact names, a
# version shape, checksums computed here). It publishes only when the PR is
# open, its head is the built commit, the build was started by someone with
# write access, and the PR is the owner's or carries the `preview` label. A
# fork PR can edit its copy of pr-preview.yml, so none of that is taken from
# the build. Built-in token only; never the fork bot App key.
#
# No concurrency group: GitHub keeps only the newest pending run of a group,
# which would drop publishes of other PRs. Publishes of one PR can't race:
# pr-preview.yml cancels a PR's older build, and a stale build fails the
# head check.

on:
  workflow_run:
    workflows: ["PR preview"]
    types: [completed]
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    if: >-
      github.repository == 'max-miller1204/learnharness-nightly' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.path == '.github/workflows/pr-preview.yml'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
      RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: selfhost
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/preview-files
      - name: Check who asked, and the files
        id: check
        run: |
          set -euo pipefail
          FILES="$RUNNER_TEMP/preview-files" OUT="$RUNNER_TEMP/preview-out"
          skip() { echo "::notice::No preview published: $*"; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0; }
          pr=$(head -c 16 "$FILES/preview-meta/pr" 2>/dev/null | tr -d '\n' || true)
          [[ "$pr" =~ ^[1-9][0-9]{0,8}$ ]] || { echo "::error::The build named no valid PR number."; exit 1; }
          info=$(gh api "repos/$GH_REPO/pulls/$pr" --jq '[.state, .head.sha, .user.login, ([.labels[].name] | index("preview") != null)] | @tsv')
          IFS=$'\t' read -r state head author labeled <<<"$info"
          [ "$state" = open ] || skip "PR #$pr is $state."
          [ "$head" = "$HEAD_SHA" ] || skip "PR #$pr moved on to $head; this build is of $HEAD_SHA."
          perm=$(gh api "repos/$GH_REPO/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null || echo none)
          case "$perm" in admin|write) ;; *) skip "the build was started by $ACTOR, who has no write access." ;; esac
          [ "$author" = "$OWNER" ] || [ "$labeled" = true ] || skip "PR #$pr is by $author and has no \`preview\` label."

          # Files are data: exact names, one version for both arches, checksums computed here.
          mkdir -p "$OUT"
          version=""
          for arch in linux-x64 linux-arm64; do
            shopt -s nullglob
            found=("$FILES/selfhost-$arch"/learnharness-*-"$arch".tar.gz)
            shopt -u nullglob
            [ "${#found[@]}" = 1 ] || { echo "::error::Expected one $arch archive, found ${#found[@]}."; exit 1; }
            name=$(basename "${found[0]}")
            [[ "$name" =~ ^learnharness-([0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]{8}\.([0-9]+))-$arch\.tar\.gz$ ]] || { echo "::error::Unexpected archive name $name."; exit 1; }
            [ "${BASH_REMATCH[2]}" = "$RUN_NUMBER" ] || { echo "::error::$name is not from build run $RUN_NUMBER."; exit 1; }
            [ -z "$version" ] || [ "$version" = "${BASH_REMATCH[1]}" ] || { echo "::error::The two arches have different versions."; exit 1; }
            version=${BASH_REMATCH[1]}
            [ -f "${found[0]}" ] && [ ! -L "${found[0]}" ] || { echo "::error::$name is not a regular file."; exit 1; }
            cp "${found[0]}" "$OUT/$name"
            (cd "$OUT" && sha256sum "$name" > "$name.sha256")
          done
          {
            echo "publish=true"
            echo "pr=$pr"
            echo "version=$version"
            echo "labeled=$labeled"
            echo "by_owner=$([ "$author" = "$OWNER" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
      - name: Publish the preview release
        if: steps.check.outputs.publish == 'true'
        env:
          PR: ${{ steps.check.outputs.pr }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          tag="preview-pr-$PR" OUT="$RUNNER_TEMP/preview-out"
          node selfhost/scripts/make-feed.ts --version "$VERSION" --tag "$tag" --sha "$HEAD_SHA" --repo "$GH_REPO" --dir "$OUT" > "$OUT/latest.json"
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          Preview of #$PR at \`$HEAD_SHA\` ($VERSION).

          Not an update: installs never see it. Run it beside your server, with fresh, empty data:

          \`\`\`sh
          lh preview $PR
          \`\`\`

          Replaced by each new build of the PR, and deleted when the PR closes. See [PR previews](https://github.com/$GH_REPO/blob/main/docs/specs/pr-previews.md).
          NOTES
          # One release per PR: replace the old build. The tag only holds
          # files, so it points at main, never at the PR's commit.
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" "$OUT"/*.tar.gz "$OUT"/*.sha256 "$OUT/latest.json" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "PR #$PR preview (${HEAD_SHA::12})" --notes-file "$RUNNER_TEMP/notes.md"
      # One-shot: a later push builds nothing until the owner adds it again.
      - name: Remove the preview label
        if: steps.check.outputs.publish == 'true' && steps.check.outputs.labeled == 'true'
        env:
          PR: ${{ steps.check.outputs.pr }}
        run: gh api -X DELETE "repos/$GH_REPO/issues/$PR/labels/preview" >/dev/null || true
      - name: Comment on the PR
        if: steps.check.outputs.publish == 'true'
        env:
          PR: ${{ steps.check.outputs.pr }}
          VERSION: ${{ steps.check.outputs.version }}
          BY_OWNER: ${{ steps.check.outputs.by_owner }}
        run: |
          set -euo pipefail
          marker="<!-- lh-pr-preview -->"
          if [ "$BY_OWNER" = true ]; then again="Each push builds a new one."; else again="A new push builds nothing until you add the \`preview\` label again."; fi
          cat > "$RUNNER_TEMP/comment.md" <<BODY
          $marker
          **Preview ready** for \`${HEAD_SHA::12}\` (\`$VERSION\`). On your server:

          \`\`\`sh
          lh preview $PR
          \`\`\`

          It runs beside your server on port 3775 with fresh, empty data, and Ctrl+C stops it and deletes it. [Release files](https://github.com/$GH_REPO/releases/tag/preview-pr-$PR). $again
          BODY
          id=$(gh api --paginate "repos/$GH_REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -F "body=@$RUNNER_TEMP/comment.md" >/dev/null
          else
            gh api -X POST "repos/$GH_REPO/issues/$PR/comments" -F "body=@$RUNNER_TEMP/comment.md" >/dev/null
          fi

  cleanup:
    name: Delete previews of closed PRs
    if: github.repository == 'max-miller1204/learnharness-nightly'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Sweep
        run: |
          set -euo pipefail
          gh release list --limit 1000 --json tagName --jq '.[].tagName | select(test("^preview-pr-[1-9][0-9]*$"))' |
          while read -r tag; do
            pr=${tag#preview-pr-}
            state=$(gh api "repos/$GH_REPO/pulls/$pr" --jq .state 2>/dev/null || echo missing)
            if [ "$state" != open ]; then
              echo "PR #$pr is $state: deleting $tag."
              gh release delete "$tag" --yes --cleanup-tag
            fi
          done
