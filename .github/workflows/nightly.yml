name: Nightly (self-hosted server)

# After CI passes on main, build the desktop and self-hosted server from
# that commit and version. One prerelease holds the verified assets.
# Installs and desktop update checks read the fixed nightly/latest.json.
# Manual dry runs build any branch and save CI artifacts only.
# Set PAUSE_NIGHTLY=true to pause publication.
#
# Keep the workflow name stable for feed-check and existing dispatches.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and smoke-test only; publish nothing"
        type: boolean
        default: false

permissions:
  contents: read

# One nightly at a time, never cancelled mid-publish. GitHub keeps only the
# newest pending run in a group. Only runs that will publish join `nightly`, so
# a CI completion that publishes nothing (a failed run, a manual CI run, a
# fork's main) or a dry run can't push out a pending real one. CI runs can finish out of order, so
# `meta` also skips a commit that is not newer than the shipped one.
concurrency:
  group: >-
    ${{ ((github.event_name == 'workflow_dispatch' && !inputs.dry_run) ||
    (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    && 'nightly' || format('nightly-noop-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"
  FORK_HOMEPAGE: https://github.com/${{ github.repository }}

jobs:
  # The commit every later job builds: for workflow_run that is the CI run's
  # head_sha (github.sha would be whatever main points at now).
  meta:
    name: Version
    if: >-
      (vars.PAUSE_NIGHTLY != 'true' || inputs.dry_run) && (
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      skip: ${{ steps.meta.outputs.skip }}
    steps:
      - id: sha
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: A manual run needs CI to have passed for this commit
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run the nightly from main (got $GITHUB_REF)."
            exit 1
          fi
          # CI succeeds only when its Check job passed.
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          if [ "$passed" = "0" ]; then
            echo "::error::CI has not passed for $SHA on main. Wait for CI, or fix it first."
            exit 1
          fi
          echo "CI passed for $SHA."
      # Full history to compare the shipped commit with this one.
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.sha.outputs.sha }}
          fetch-depth: 0
      - id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          base=$(node -p "require('./package.json').version")
          # Use the original run's date so a re-run reuses the same draft.
          created=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.created_at')
          day=$(date -u -d "$created" +%Y%m%d)
          version="${base}-nightly.${day}.${GITHUB_RUN_NUMBER}"
          { echo "version=$version"; echo "tag=v$version"; } >> "$GITHUB_OUTPUT"
          shipped=$(gh release download nightly -p latest.json -O - 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).sha)}catch{console.log("")}})' || true)
          skip=false
          if [ "$DRY_RUN" != "true" ] && [ -n "$shipped" ]; then
            if [ "$shipped" = "$SHA" ] && [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
              echo "The newest nightly already ships $SHA."
              skip=true
            else
              # Exit 1: the shipped commit is not in this one's history, so this
              # run is older (CI finished out of order, or an old run was
              # re-run). Any other error (shipped commit unknown) publishes.
              git merge-base --is-ancestor "$shipped" "$SHA" && rc=0 || rc=$?
              if [ "$rc" = "1" ]; then
                echo "$SHA is not newer than the shipped $shipped. Skipping."
                skip=true
              fi
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  # The same build and gates as a PR preview (selfhost-bundle.yml).
  bundle:
    name: Bundle
    needs: meta
    if: needs.meta.outputs.skip != 'true'
    uses: ./.github/workflows/selfhost-bundle.yml
    with:
      sha: ${{ needs.meta.outputs.sha }}
      version: ${{ needs.meta.outputs.version }}
      include_macos: true

  desktop:
    name: Desktop
    needs: meta
    if: needs.meta.outputs.skip != 'true'
    uses: ./.github/workflows/nightly-desktop.yml
    with:
      sha: ${{ needs.meta.outputs.sha }}
      version: ${{ needs.meta.outputs.version }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      MAC_CSC_LINK: ${{ !inputs.dry_run && secrets.MAC_CSC_LINK || '' }}
      MAC_CSC_KEY_PASSWORD: ${{ !inputs.dry_run && secrets.MAC_CSC_KEY_PASSWORD || '' }}
      APPLE_API_KEY: ${{ !inputs.dry_run && secrets.APPLE_API_KEY || '' }}
      APPLE_API_KEY_ID: ${{ !inputs.dry_run && secrets.APPLE_API_KEY_ID || '' }}
      APPLE_API_ISSUER: ${{ !inputs.dry_run && secrets.APPLE_API_ISSUER || '' }}

  release:
    name: Publish
    needs: [meta, bundle, desktop]
    if: needs.meta.outputs.skip != 'true' && !inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: nightly-feed
      cancel-in-progress: false
    permissions:
      contents: write
      # The AI release notes read the PR descriptions of the range.
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.meta.outputs.tag }}
      SHA: ${{ needs.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - uses: actions/download-artifact@v8
        with:
          pattern: selfhost-*
          merge-multiple: true
          path: dist-selfhost
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist-desktop
      - run: npm ci --ignore-scripts
      # Release notes (docs/specs/t3-style-updates.md, section 2): an AI
      # summary of the user-facing changes through OpenRouter (T3 Code's
      # approach), or the plain commit list when that fails. The items go into
      # the release body and into latest.json, where the app reads them.
      - name: Previous tag and feed
        id: prev
        run: |
          gh release download nightly -p latest.json -O previous-latest.json 2>/dev/null || echo '{}' > previous-latest.json
          prev=$(node -p 'require("./previous-latest.json").tag ?? ""')
          echo "tag=$prev" >> "$GITHUB_OUTPUT"
          echo "published_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: AI release notes
        continue-on-error: true
        timeout-minutes: 5
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'anthropic/claude-haiku-5.5' }}
          PREV: ${{ steps.prev.outputs.tag }}
          PUBLISHED_AT: ${{ steps.prev.outputs.published_at }}
        run: |
          node scripts/generate-release-notes.ts --repository "$GITHUB_REPOSITORY" --tag "$TAG" \
            --ref "$SHA" --previous-tag "$PREV" --version "$VERSION" --published-at "$PUBLISHED_AT" --output notes.json
      - name: Release notes
        env:
          PREV: ${{ steps.prev.outputs.tag }}
          PUBLISHED_AT: ${{ steps.prev.outputs.published_at }}
        run: |
          if [ ! -f notes.json ]; then
            echo "::warning::No AI release notes; using the commit list."
            node scripts/generate-release-notes.ts --fallback --ref "$SHA" --previous-tag "$PREV" \
              --version "$VERSION" --published-at "$PUBLISHED_AT" --output notes.json
          fi
          {
            if [ "$(node -p 'require("./notes.json").items.length')" != "0" ]; then
              echo "### What's changed"
              echo
              node -e 'for (const item of require("./notes.json").items) console.log("- " + item)'
              echo
            fi
            if [ -n "$PREV" ]; then
              echo "<details>"
              echo "<summary>Full changelog</summary>"
              echo
              echo "### Changes since $PREV"
              git log -n 200 --no-merges --format='- %s (%h)' "$PREV..$SHA"
              echo
              echo "</details>"
              echo
            fi
            echo "Nightly build of \`${SHA::12}\` from \`main\`."
            echo
            echo "Desktop installers are in Assets. For the server, see [self-hosting](${FORK_HOMEPAGE}/blob/main/docs/self-hosting.md)."
          } > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Feed entry
        env:
          PUBLISHED_AT: ${{ steps.prev.outputs.published_at }}
        run: |
          node selfhost/scripts/make-feed.ts --version "$VERSION" --tag "$TAG" --sha "$SHA" --repo "$GITHUB_REPOSITORY" \
            --dir dist-selfhost --published-at "$PUBLISHED_AT" --notes notes.json --previous previous-latest.json > dist-selfhost/latest.json
      - name: Stage or resume one draft for this commit
        id: draft
        run: |
          existing=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -ce --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)]')
          count=$(jq length <<< "$existing")
          if [ "$count" -gt 1 ]; then
            ids=$(jq -r 'map(.id | tostring) | join(", ")' <<< "$existing")
            echo "::error::Found $count releases for $TAG (IDs: $ids). Resolve the duplicates before rerunning the nightly."
            exit 1
          fi
          if [ "$count" = 0 ]; then
            gh release create "$TAG" --target "$SHA" --draft --prerelease --latest=false \
              --title "LearnHarness Nightly $VERSION (${SHA::12})" --notes-file notes.md
            draft_id=$(gh release view "$TAG" --json databaseId --jq '.databaseId')
          else
            if ! draft_id=$(jq -er --arg sha "$SHA" \
              '.[0] | select(.draft and .prerelease and .target_commitish == $sha) | .id' <<< "$existing"); then
              echo "::error::$TAG already exists and is not a draft prerelease for $SHA."
              exit 1
            fi
            gh release edit "$TAG" --notes-file notes.md
          fi
          if git show-ref --verify --quiet "refs/tags/$TAG" && [ "$(git rev-parse "$TAG^{commit}")" != "$SHA" ]; then
            echo "::error::$TAG already points at a different commit"
            exit 1
          fi
          echo "id=$draft_id" >> "$GITHUB_OUTPUT"
          gh release upload "$TAG" dist-desktop/* dist-selfhost/* --clobber
      - name: Verify draft and publish the combined prerelease
        env:
          DRAFT_ID: ${{ steps.draft.outputs.id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID" > draft.json
          node scripts/verify-nightly.ts "$VERSION" "$SHA" "$GITHUB_REPOSITORY" dist-desktop dist-selfhost draft.json
          gh release edit "$TAG" --draft=false --prerelease --latest=false
      - name: Point the `nightly` feed at it
        run: |
          if ! gh release view nightly >/dev/null 2>&1; then
            gh release create nightly --target "$SHA" --prerelease --latest=false \
              --title "Nightly feed (install.sh + latest.json)" \
              --notes "Fixed release for the installer and update feed. Builds live in the v*-nightly.* prereleases. See docs/self-hosting.md."
          fi
          cp selfhost/install.sh dist-selfhost/install.sh
          gh release upload nightly dist-selfhost/latest.json dist-selfhost/install.sh --clobber
      - name: Prune beyond the newest 30 nightlies
        run: |
          gh release list --limit 1000 --exclude-drafts --json tagName,publishedAt --jq '[.[] | select(.tagName | test("^v.*-nightly\\."))] | sort_by(.publishedAt) | reverse | .[30:] | .[].tagName' |
          while read -r old; do
            [ -n "$old" ] && gh release delete "$old" --yes --cleanup-tag
          done
