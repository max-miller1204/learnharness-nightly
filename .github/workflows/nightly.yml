name: Nightly (self-hosted server)

# After CI passes on a push to main, this builds the self-hosted server for
# linux-x64 and linux-arm64 from that exact commit and publishes one
# prerelease (v<version>-nightly.<date>.<run>), all or nothing: CI's `Check`
# (typecheck, tests, lint, launcher tests, standalone builds) already passed
# for the commit, and both bundles and both archive smoke tests must pass
# here. Installs read the fixed `nightly` release's latest.json. See
# docs/self-hosting.md, docs/fork-workflow.md and docs/specs/ci-foundation.md.
#
# A manual run builds the head of main and refuses unless CI's `Check`
# passed for it. Pause with the repository variable PAUSE_NIGHTLY=true.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and smoke-test only; publish nothing"
        type: boolean
        default: false

permissions:
  contents: read

# One nightly at a time, never cancelled mid-publish. GitHub keeps only the
# newest pending run in a group. Only runs that will build join `nightly`, so a
# CI completion that publishes nothing (a failed run, a manual CI run, a fork's
# main) can't push out a pending real one. CI runs can finish out of order, so
# `meta` also skips a commit that is not newer than the shipped one.
concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' ||
    (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    && 'nightly' || format('nightly-noop-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"
  FORK_HOMEPAGE: https://github.com/${{ github.repository }}

jobs:
  # The commit every later job builds: for workflow_run that is the CI run's
  # head_sha (github.sha would be whatever main points at now).
  meta:
    name: Version
    if: >-
      vars.PAUSE_NIGHTLY != 'true' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      skip: ${{ steps.meta.outputs.skip }}
    steps:
      - id: sha
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: A manual run needs CI to have passed for this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run the nightly from main (got $GITHUB_REF)."
            exit 1
          fi
          # CI succeeds only when its Check job passed.
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          if [ "$passed" = "0" ]; then
            echo "::error::CI has not passed for $SHA on main. Wait for CI, or fix it first."
            exit 1
          fi
          echo "CI passed for $SHA."
      # Full history to compare the shipped commit with this one.
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.sha.outputs.sha }}
          fetch-depth: 0
      - id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          base=$(node -p "require('./package.json').version")
          version="${base}-nightly.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHA::12}" >> "$GITHUB_OUTPUT"
          shipped=$(gh release download nightly -p latest.json -O - 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).sha)}catch{console.log("")}})' || true)
          skip=false
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ -n "$shipped" ]; then
            if [ "$shipped" = "$SHA" ]; then
              echo "The newest nightly already ships $SHA."
              skip=true
            else
              # Exit 1: the shipped commit is not in this one's history, so this
              # run is older (CI finished out of order, or an old run was
              # re-run). Any other error (shipped commit unknown) publishes.
              git merge-base --is-ancestor "$shipped" "$SHA" && rc=0 || rc=$?
              if [ "$rc" = "1" ]; then
                echo "$SHA is not newer than the shipped $shipped. Skipping."
                skip=true
              fi
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  bundle:
    name: Bundle (${{ matrix.arch }})
    needs: meta
    if: needs.meta.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: linux-x64
            node_arch: x64
          - runner: ubuntu-24.04-arm
            arch: linux-arm64
            node_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run plugins:setup
      - run: npm run build
        env:
          LH_VERSION: ${{ env.VERSION }}
          LH_HOMEPAGE: ${{ env.FORK_HOMEPAGE }}
      # Same gates as CI and the desktop release, on the host Node.
      - run: node scripts/smoke-provider-runtime.mjs
      - run: node scripts/build-server.mjs
      - run: node scripts/smoke-server.mjs
      - name: Download the Node runtime that ships in the archive
        run: |
          nv=$(node -p process.version)
          file="node-${nv}-linux-${{ matrix.node_arch }}.tar.xz"
          cd "$RUNNER_TEMP"
          curl -fsSLO --retry 3 "https://nodejs.org/dist/${nv}/${file}"
          curl -fsSLO --retry 3 "https://nodejs.org/dist/${nv}/SHASUMS256.txt"
          grep " ${file}\$" SHASUMS256.txt | sha256sum -c -
          tar -xJf "$file"
          echo "NODE_DIR=$RUNNER_TEMP/node-${nv}-linux-${{ matrix.node_arch }}" >> "$GITHUB_ENV"
      - name: Assemble the archive
        run: node selfhost/scripts/package-archive.ts --version "$VERSION" --arch "${{ matrix.arch }}" --node-dir "$NODE_DIR" --standalone .next/standalone --out dist-selfhost
      - name: Smoke the assembled archive with its bundled Node
        run: |
          dir="$RUNNER_TEMP/archive"
          mkdir -p "$dir"
          tar -xzf "dist-selfhost/learnharness-${VERSION}-${{ matrix.arch }}.tar.gz" -C "$dir"
          "$dir/lh" __selftest --expect-version "$VERSION"
      - name: Launcher tests on this arch
        run: node --test selfhost/tests/*.test.ts
      - uses: actions/upload-artifact@v7
        with:
          name: selfhost-${{ matrix.arch }}
          path: dist-selfhost/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish
    needs: [meta, bundle]
    if: needs.meta.outputs.skip != 'true' && !inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      # The AI release notes read the PR descriptions of the range.
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.meta.outputs.tag }}
      SHA: ${{ needs.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - uses: actions/download-artifact@v8
        with:
          pattern: selfhost-*
          merge-multiple: true
          path: dist-selfhost
      # Release notes (docs/specs/t3-style-updates.md, section 2): an AI
      # summary of the user-facing changes through OpenRouter (T3 Code's
      # approach), or the plain commit list when that fails. The items go into
      # the release body and into latest.json, where the app reads them.
      - name: Previous tag and feed
        id: prev
        run: |
          prev=$(git tag --list 'v*-nightly.*' --sort=-creatordate | head -n 1)
          echo "tag=$prev" >> "$GITHUB_OUTPUT"
          gh release download nightly -p latest.json -O previous-latest.json 2>/dev/null || echo '{}' > previous-latest.json
          echo "published_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: AI release notes
        continue-on-error: true
        timeout-minutes: 5
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'anthropic/claude-haiku-5.5' }}
          PREV: ${{ steps.prev.outputs.tag }}
          PUBLISHED_AT: ${{ steps.prev.outputs.published_at }}
        run: |
          node scripts/generate-release-notes.ts --repository "$GITHUB_REPOSITORY" --tag "$TAG" \
            --ref "$SHA" --previous-tag "$PREV" --version "$VERSION" --published-at "$PUBLISHED_AT" --output notes.json
      - name: Release notes
        env:
          PREV: ${{ steps.prev.outputs.tag }}
          PUBLISHED_AT: ${{ steps.prev.outputs.published_at }}
        run: |
          if [ ! -f notes.json ]; then
            echo "::warning::No AI release notes; using the commit list."
            node scripts/generate-release-notes.ts --fallback --ref "$SHA" --previous-tag "$PREV" \
              --version "$VERSION" --published-at "$PUBLISHED_AT" --output notes.json
          fi
          {
            if [ "$(node -p 'require("./notes.json").items.length')" != "0" ]; then
              echo "### What's changed"
              echo
              node -e 'for (const item of require("./notes.json").items) console.log(`- ${item}`)'
              echo
            fi
            if [ -n "$PREV" ]; then
              echo "<details>"
              echo "<summary>Full changelog</summary>"
              echo
              echo "### Changes since $PREV"
              git log --no-merges --format='- %s (%h)' "$PREV..$SHA" | head -n 200
              echo
              echo "</details>"
              echo
            fi
            echo "Nightly build of \`${SHA::12}\` from \`main\`."
            echo
            echo "Install or update: see [self-hosting](${FORK_HOMEPAGE}/blob/main/docs/self-hosting.md)."
          } > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Feed entry
        env:
          PUBLISHED_AT: ${{ steps.prev.outputs.published_at }}
        run: |
          node selfhost/scripts/make-feed.ts --version "$VERSION" --tag "$TAG" --sha "$SHA" --repo "$GITHUB_REPOSITORY" \
            --dir dist-selfhost --published-at "$PUBLISHED_AT" --notes notes.json --previous previous-latest.json > dist-selfhost/latest.json
      - name: Create the prerelease
        run: |
          gh release create "$TAG" dist-selfhost/*.tar.gz dist-selfhost/*.sha256 dist-selfhost/latest.json \
            --target "$SHA" --prerelease --latest=false \
            --title "LearnHarness Nightly $VERSION (${SHA::12})" --notes-file notes.md
      - name: Point the `nightly` feed at it
        run: |
          if ! gh release view nightly >/dev/null 2>&1; then
            gh release create nightly --target "$SHA" --prerelease --latest=false \
              --title "Nightly feed (install.sh + latest.json)" \
              --notes "Fixed release for the installer and update feed. Builds live in the v*-nightly.* prereleases. See docs/self-hosting.md."
          fi
          cp selfhost/install.sh dist-selfhost/install.sh
          gh release upload nightly dist-selfhost/latest.json dist-selfhost/install.sh --clobber
      - name: Prune beyond the newest 30 nightlies
        run: |
          gh release list --limit 1000 --json tagName,createdAt --jq '[.[] | select(.tagName | test("^v.*-nightly\\."))] | sort_by(.createdAt) | reverse | .[30:] | .[].tagName' |
          while read -r old; do
            [ -n "$old" ] && gh release delete "$old" --yes --cleanup-tag
          done
