name: PR preview approval

# Record the exact commit the repository owner labeled. This is the default
# branch's workflow. It never checks out code or reads build artifacts.
on:
  pull_request_target:
    types: [labeled]

permissions: {}

jobs:
  record:
    if: >-
      github.repository == 'max-miller1204/learnharness-nightly' &&
      github.event.label.name == 'preview' &&
      github.event.sender.login == github.repository_owner &&
      github.event.pull_request.user.login != github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: printf '%s %s\n' "$PR" "$HEAD_SHA" > approval
      - uses: actions/upload-artifact@v7
        with:
          name: preview-approval-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: approval
          if-no-files-found: error
          retention-days: 7
