name: Nightly desktop packages

on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
      version:
        type: string
        required: true
      dry_run:
        type: boolean
        required: true
    secrets:
      MAC_CSC_LINK:
      MAC_CSC_KEY_PASSWORD:
      APPLE_API_KEY:
      APPLE_API_KEY_ID:
      APPLE_API_ISSUER:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  LH_VERSION: ${{ inputs.version }}
  LH_HOMEPAGE: https://github.com/${{ github.repository }}

jobs:
  package:
    name: Package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: mac-arm64
            builder_args: --mac --arm64
          - os: windows-2025
            platform: windows-x64
            builder_args: --win --x64
          - os: ubuntu-24.04
            platform: linux-x64
            builder_args: --linux AppImage --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - name: Select Xcode for the Icon Composer assets
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - run: npm run plugins:setup
      - name: Native renderer tests
        run: npx electron --import tsx --test tests/pdf-native-render.test.ts tests/pdf-ops.test.ts tests/svg-native-render.test.ts tests/browser-service.test.ts
        env:
          NODE_ENV: test
          ELECTRON_RUN_AS_NODE: "1"
      - run: npm run build
      - run: node scripts/smoke-provider-runtime.mjs
      - run: node scripts/build-server.mjs
      - run: node scripts/smoke-server.mjs --electron
      - name: Package without release access
        if: runner.os != 'macOS' || inputs.dry_run
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-builder ${{ matrix.builder_args }} --publish never -c.mac.notarize=false \
            -c.extraMetadata.version="$LH_VERSION" -c.extraMetadata.lhNightlyRepository="$GITHUB_REPOSITORY"
      - name: Sign, notarize and staple the Apple silicon app
        if: runner.os == 'macOS' && !inputs.dry_run
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_PEM: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY_PEM APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: ${name%_PEM}"
              exit 1
            fi
          done
          export CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
          umask 077
          APPLE_API_KEY=$(mktemp "$RUNNER_TEMP/notary.XXXXXX")
          trap 'rm -f "$APPLE_API_KEY"' EXIT
          printf '%s\n' "$APPLE_API_KEY_PEM" > "$APPLE_API_KEY"
          unset APPLE_API_KEY_PEM
          export APPLE_API_KEY
          npx electron-builder ${{ matrix.builder_args }} --publish never -c.forceCodeSigning=true \
            -c.extraMetadata.version="$LH_VERSION" -c.extraMetadata.lhNightlyRepository="$GITHUB_REPOSITORY"
          app="dist/mac-arm64/LearnHarness Nightly.app"
          codesign --verify --deep --strict "$app"
          codesign -dvv "$app" 2>&1 | grep '^Authority=Developer ID Application:'
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
      - name: Exercise the packaged server and browser runtime
        run: |
          case "$RUNNER_OS" in
            macOS)
              app="dist/mac-arm64/LearnHarness Nightly.app/Contents"
              payload="$app/Resources/server/standalone"
              runtime="$app/MacOS/LearnHarness Nightly"
              runner=()
              ;;
            Windows)
              payload="dist/win-unpacked/resources/server/standalone"
              runtime="dist/win-unpacked/LearnHarness Nightly.exe"
              runner=()
              ;;
            Linux)
              payload="dist/linux-unpacked/resources/server/standalone"
              runtime="dist/linux-unpacked/learnharness"
              runner=(xvfb-run -a)
              ;;
          esac
          node scripts/smoke-provider-runtime.mjs --standalone "$payload"
          node scripts/smoke-provider-runtime.mjs --standalone "$payload" --runtime "$runtime"
          "${runner[@]}" node scripts/smoke-demo-runtime.mjs --standalone "$payload" --runtime "$runtime" --browser
      - name: Save installers and update metadata
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml
