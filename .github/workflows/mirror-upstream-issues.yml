name: Mirror upstream issues

# Copies each upstream issue into the fork once, as an issue labeled
# `upstream` (title, body and the comments that exist then), and keeps the
# `upstream-closed` label matching upstream's state. Mirrors stay open here.
# Copied text sits in code blocks and upstream references are written as code,
# so nothing pings anyone upstream. Design: docs/specs/upstream-issue-mirror.md.
#
# Local equivalent: selfhost/scripts/mirror-upstream-issues.sh [issue]
# Authenticates as the fork bot GitHub App (see docs/fork-workflow.md).

on:
  schedule:
    - cron: "47 * * * *"
  push: # TEMP verification, removed before merge
    branches: [feat/mirror-upstream-issues]
  workflow_dispatch:
    inputs:
      issue:
        description: "Mirror only this upstream issue number (optional; even an older closed one)"
        required: false
        type: string

permissions:
  contents: read

# Two runs at once could create the same mirror twice.
concurrency:
  group: mirror-upstream-issues
  cancel-in-progress: false

env:
  UPSTREAM_REPO: amosblomqvist/learnharness
  FORK_REPO: ${{ github.repository }}

jobs:
  mirror:
    if: github.repository == 'max-miller1204/learnharness-nightly'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ISSUE: ${{ inputs.issue || '792' }} # TEMP
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/fork-bot-token
        with:
          client-id: ${{ secrets.FORK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FORK_BOT_PRIVATE_KEY }}
      - name: Mirror
        run: bash selfhost/scripts/mirror-upstream-issues.sh ${ISSUE:+"$ISSUE"}
