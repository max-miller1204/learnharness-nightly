name: Upstream sync

# Upstream is a feed you choose from, not something that lands on its own.
# Every hour this mirrors upstream main to the `upstream-main` branch and
# keeps ONE standing "Sync upstream" PR open into main (or closes it once
# main contains everything). It never pushes to main. Merge the PR with
# "Create a merge commit", never squash, so later syncs merge cleanly.
#
# When upstream's .github/ differs from what `upstream-main` holds now, it
# pauses: it pushes nothing and leaves the Sync PR alone, and the run fails
# listing the files. A push here runs the pushed branch's own workflows, so
# read the diff, then run this workflow with allow_github_changes ticked.
#
# Authenticates as the fork bot GitHub App (FORK_BOT_CLIENT_ID and
# FORK_BOT_PRIVATE_KEY, secrets of the main-only `fork-bot` environment), so CI
# runs on the PR. PRs opened with the built-in token don't run CI. See
# docs/fork-workflow.md and docs/specs/simplify-upstream-intake.md.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      allow_github_changes:
        description: "Sync even though upstream changes .github/ (read the diff first: those workflows would run here)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: amosblomqvist/learnharness
  UPSTREAM_BRANCH: main
  MIRROR_BRANCH: upstream-main

jobs:
  sync:
    if: github.repository == 'max-miller1204/learnharness-nightly'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The App key is a secret of this main-only environment (docs/fork-workflow.md).
    environment:
      name: fork-bot
      deployment: false
    steps:
      # Compares against origin/main, so the checked-out ref doesn't matter.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/fork-bot-token
        with:
          client-id: ${{ secrets.FORK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FORK_BOT_PRIVATE_KEY }}
      - name: Mirror upstream
        env:
          ALLOW_GITHUB_CHANGES: ${{ inputs.allow_github_changes }}
        run: |
          set -euo pipefail
          upstream="refs/remotes/upstream/${UPSTREAM_BRANCH}"
          git fetch --no-tags "https://github.com/${UPSTREAM_REPO}.git" "+${UPSTREAM_BRANCH}:${upstream}"
          # Compared as trees with what upstream-main holds now (or, without
          # it, with upstream's merge base with main).
          if git rev-parse -q --verify "refs/remotes/origin/${MIRROR_BRANCH}" >/dev/null; then
            base="refs/remotes/origin/${MIRROR_BRANCH}"
          else
            base=$(git merge-base origin/main "$upstream") || { echo "::error::No ${MIRROR_BRANCH} branch and no history shared with upstream to compare .github/ against."; exit 1; }
          fi
          changes=$(git diff --no-renames --name-only "$base" "$upstream" -- .github)
          if [ -n "$changes" ] && [ "${ALLOW_GITHUB_CHANGES:-}" != true ]; then
            echo "::error::Upstream changes .github/, so the sync is paused (nothing pushed, the Sync PR is unchanged): ${changes//$'\n'/ }. Read the diff (https://github.com/${GITHUB_REPOSITORY}/compare/${MIRROR_BRANCH}...${UPSTREAM_REPO%%/*}:${UPSTREAM_REPO#*/}:${UPSTREAM_BRANCH}), then run Upstream sync with allow_github_changes."
            exit 1
          fi
          git push --force origin "${upstream}:refs/heads/${MIRROR_BRANCH}"
      - name: Open, update or close the Sync PR
        run: |
          set -euo pipefail
          upstream="refs/remotes/upstream/${UPSTREAM_BRANCH}"
          existing=$(gh pr list --head "$MIRROR_BRANCH" --base main --state open --json number --jq '.[0].number // ""')
          if git merge-base --is-ancestor "$upstream" origin/main; then
            echo "main already contains upstream."
            if [ -n "$existing" ]; then
              gh pr close "$existing" --comment "main already contains everything from upstream. Closing; a new Sync PR opens when upstream moves."
            fi
            exit 0
          fi
          count=$(git rev-list --count "origin/main..$upstream")
          title="Sync upstream (${count} new commit$([ "$count" = 1 ] || echo s))"
          {
            echo "Upstream \`${UPSTREAM_REPO}@${UPSTREAM_BRANCH}\` has ${count} commit(s) that \`main\` doesn't."
            echo
            echo "Review what's worth taking. Merge with **Create a merge commit** (never squash or rebase), so the next sync knows these commits are in. Leave it open to skip for now; this PR updates itself every hour."
            echo
            echo "**Merge status:** STATUS_PLACEHOLDER"
            echo
            echo "### Commits"
            # Subjects as code: no @mentions, no #links into this fork, and no
            # "mentioned this" entries on upstream's PRs.
            git log --no-merges --format='%h%x09%s' "origin/main..$upstream" | head -n 300 |
              while IFS=$'\t' read -r hash subject; do printf -- '- `%s` %s\n' "${subject//\`/\'}" "$hash"; done
            prs=$(git log --format='%s %b' "origin/main..$upstream" | grep -o '#[0-9]\+' | sort -u -t'#' -k2n | tr '\n' ' ' || true)
            if [ -n "$prs" ]; then
              echo
              echo "### Upstream PRs referenced"
              for pr in $prs; do echo "- \`${UPSTREAM_REPO}${pr}\`"; done
            fi
          } > body.md
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body-file body.md
            number="$existing"
          else
            url=$(gh pr create --head "$MIRROR_BRANCH" --base main --title "$title" --body-file body.md)
            number="${url##*/}"
          fi
          # GitHub computes mergeability in the background.
          state="UNKNOWN"
          for _ in $(seq 1 12); do
            state=$(gh pr view "$number" --json mergeable --jq .mergeable)
            [ "$state" != "UNKNOWN" ] && break
            sleep 5
          done
          case "$state" in
            MERGEABLE) status="merges cleanly." ;;
            CONFLICTING) status="**has conflicts.** Resolve them in this PR (or locally on \`${MIRROR_BRANCH}\` merged into a branch from \`main\`)." ;;
            *) status="GitHub hasn't decided yet; check the PR page." ;;
          esac
          sed -i "s|STATUS_PLACEHOLDER|${status//|/\\|}|" body.md
          gh pr edit "$number" --body-file body.md
          echo "Sync PR #${number}: ${title} (${state})"
