name: Import upstream PR

# Bring one upstream PR into the fork for review: its exact head commits go
# to `upstream-pr/<N>` unchanged, and a fork PR into main links the
# original and credits its author. Running it again updates the branch.
# Merge these with "Create a merge commit", never squash, so a later
# upstream version of the same work has the best chance to merge cleanly.
#
# Local equivalent: selfhost/scripts/import-upstream-pr.sh <N>
# Authenticates as the fork bot GitHub App (see docs/fork-workflow.md).

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Upstream PR number"
        required: true
        type: number

permissions:
  contents: read

env:
  UPSTREAM_REPO: amosblomqvist/learnharness

jobs:
  import:
    if: github.repository == 'max-miller1204/learnharness-nightly'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PR: ${{ inputs.pr }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/fork-bot-token
        with:
          client-id: ${{ secrets.FORK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FORK_BOT_PRIVATE_KEY }}
      - name: Import
        run: bash selfhost/scripts/import-upstream-pr.sh "$PR"
