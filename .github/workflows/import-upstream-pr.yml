name: Import upstream PR

# Bring one upstream PR into the fork for review: its exact head commits go
# to `upstream-pr/<N>` unchanged, and a fork PR into main links the
# original and credits its author. Running it again updates the branch.
# Merge these with "Create a merge commit", never squash, so a later
# upstream version of the same work has the best chance to merge cleanly.
# The fork PR body links the upstream PR by URL, so upstream's PR shows a
# "mentioned this" entry (docs/specs/simplify-upstream-intake.md).
#
# An upstream PR that changes .github/ is refused unless allow_github_changes
# is ticked: the pushed branch's own workflows would run here with this
# repository's secrets. Read its diff before ticking it.
#
# Local equivalent: selfhost/scripts/import-upstream-pr.sh <N>
# Authenticates as the fork bot GitHub App (see docs/fork-workflow.md). Its key
# is in the main-only `fork-bot` environment, so run this from main.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Upstream PR number"
        required: true
        type: number
      allow_github_changes:
        description: "Allow a PR that changes .github/ (read its diff first: its workflows would run here with this repository's secrets)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  UPSTREAM_REPO: amosblomqvist/learnharness

jobs:
  import:
    if: github.repository == 'max-miller1204/learnharness-nightly'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The App key is a secret of this main-only environment (docs/fork-workflow.md).
    environment:
      name: fork-bot
      deployment: false
    env:
      PR: ${{ inputs.pr }}
      ALLOW_GITHUB_CHANGES: ${{ inputs.allow_github_changes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/fork-bot-token
        with:
          client-id: ${{ secrets.FORK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FORK_BOT_PRIVATE_KEY }}
      - name: Import
        run: bash selfhost/scripts/import-upstream-pr.sh "$PR"
