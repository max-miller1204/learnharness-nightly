name: CI

# Parallel jobs gated by what a PR changes, with one required check, `Check`,
# at the end. Modeled on T3 Code's ci.yml. See docs/specs/ci-foundation.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its older run; runs on main are never cancelled
# (nightly.yml waits for them).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # Skips jobs a pull request cannot affect: docs-only changes run only lint,
  # and test-only changes skip the standalone builds. Pushes to main and
  # manual runs run everything. Detection fails open: if the diff cannot be
  # read, everything runs. .github/scripts/ci-changes.cjs holds the rules.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      typecheck: ${{ steps.detect.outputs.typecheck }}
      test: ${{ steps.detect.outputs.test }}
      selfhost: ${{ steps.detect.outputs.selfhost }}
      standalone: ${{ steps.detect.outputs.standalone }}
      mobile: ${{ steps.detect.outputs.mobile }}
      iphone: ${{ steps.detect.outputs.iphone }}
    steps:
      # Depth 2 brings the base commit the PR's merge commit is diffed against.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Detect affected jobs
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -uo pipefail
          decide() {
            node .github/scripts/ci-changes.cjs "$@" | tee -a "$GITHUB_OUTPUT"
            exit "${PIPESTATUS[0]}"
          }
          if [[ "$EVENT_NAME" != pull_request ]]; then
            decide --full
          fi
          # A pull request checks out GitHub's merge commit, so its first parent
          # is the base branch and the diff is the PR's change. --no-renames
          # lists a rename as both its old and new path.
          if ! git diff --name-only --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/changed-paths"; then
            echo "Could not diff against the base. Running every job."
            decide
          fi
          decide --paths "$RUNNER_TEMP/changed-paths"

  # Always runs (T3: lint covers every file). Also tests the change classifier.
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
      # Dependabot can only read the SDK plugins through their committed
      # .sdk/package.json, so it must match what setup-deps just regenerated
      # with `npm run sdk`. See docs/specs/dependency-updates.md.
      - name: Committed plugin SDK manifests are current
        run: |
          set -euo pipefail
          for manifest in plugins/*/package.json; do
            dir=$(dirname "$manifest")
            if node -e 'process.exit(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).scripts?.sdk ? 0 : 1)' "$manifest" &&
              ! git ls-files --error-unmatch "$dir/.sdk/package.json" > /dev/null 2>&1; then
              echo "::error file=$dir/package.json::Commit $dir/.sdk/package.json: run npm run plugins:setup, then git add -f $dir/.sdk/package.json."
              exit 1
            fi
          done
          if ! git diff --exit-code -- 'plugins/*/.sdk/package.json'; then
            echo "::error::A committed plugins/*/.sdk/package.json is out of date. Run npm run plugins:setup and commit the result (after a Pi or typebox bump, also npm install in each SDK plugin)."
            exit 1
          fi
      - run: npm run lint
      - name: CI script tests
        run: node --test .github/scripts/*.test.cjs

  typecheck:
    name: Typecheck
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.typecheck != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
      - run: npm run typecheck

  # `npm test` split five ways. Node assigns test files to shards round-robin
  # over the sorted file list. With four shards the four slowest files (the
  # plugin-*-types tests, about 45 s each) all landed in shard 1; five spreads
  # them. Some tests start Electron, so its download is cached and fetched
  # before the tests run.
  test:
    name: Test ${{ matrix.shard }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.test != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        with:
          electron: "true"
      - name: Test
        env:
          NODE_ENV: test
        run: npx tsx --test --test-shard=${{ matrix.shard }}/${{ strategy.job-total }} tests/*.test.ts tests/*.test.tsx

  # The lh launcher uses Node built-ins only, so no install.
  selfhost:
    name: Launcher tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.selfhost != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: node --test selfhost/tests/*.test.ts

  standalone:
    name: Standalone (${{ matrix.platform }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.standalone != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard macos-15 runners are Apple Silicon (not macos-15-intel).
          - os: macos-15
            platform: mac-arm64
          - os: windows-2025
            platform: windows-x64
          - os: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        with:
          electron: "true"
      - name: Native renderer tests on this OS
        run: npx electron --import tsx --test tests/pdf-native-render.test.ts tests/pdf-ops.test.ts tests/svg-native-render.test.ts tests/browser-service.test.ts
        env:
          NODE_ENV: test
          ELECTRON_RUN_AS_NODE: "1"
      # Restored on every run, saved only from main so PRs never evict each
      # other's entries (T3's rule for its build caches).
      - name: Restore the Next.js build cache
        uses: actions/cache/restore@v6
        with:
          path: .next/cache
          key: nextjs-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'plugins/*/package-lock.json') }}-${{ github.sha }}
          restore-keys: nextjs-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'plugins/*/package-lock.json') }}-
      - run: npm run build
      - name: Save the Next.js build cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: .next/cache
          key: nextjs-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'plugins/*/package-lock.json') }}-${{ github.sha }}
      # Check the fresh trace before any static copying/curation.
      - run: node scripts/smoke-provider-runtime.mjs
      - run: node scripts/build-server.mjs
      - run: node scripts/smoke-server.mjs --electron

  mobile:
    name: Mobile
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPO_NO_TELEMETRY: "1"
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run deps:check
      # OTA config and the fingerprint guard. See docs/specs/mobile-auto-updates.md.
      - name: Update config is complete
        run: |
          npx expo config --type public --json > "$RUNNER_TEMP/expo-config.json"
          node ../../.github/scripts/mobile-release.cjs check-config "$RUNNER_TEMP/expo-config.json" eas.json
      - name: The iOS fingerprint hashes Expo native modules
        run: |
          npx expo-updates runtimeversion:resolve --platform ios > "$RUNNER_TEMP/runtime.json"
          node ../../.github/scripts/mobile-release.cjs expo-modules "$RUNNER_TEMP/runtime.json"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run export:ios
      - run: npm run export:android

  # The phone app on an iOS Simulator against a throwaway server: iPhone and
  # web screenshots side by side, and a failure on a screen that is not
  # reached, an error screen, or a quiz choice row that is not one item
  # speaking its math. No secrets, nothing published, and the app runs the
  # PR's code from this job's Metro. See docs/specs/ios-simulator-ci.md.
  iphone:
    name: iPhone
    needs: changes
    if: needs.changes.outputs.iphone == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      EXPO_NO_TELEMETRY: "1"
      PROVE_CHROME: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
      AXE_URL: https://github.com/cameroncooke/AXe/releases/download/v2.0.4/AXe-macOS-v2.0.4-universal.tar.gz
      AXE_SHA256: 3178ec66d9ff46455fec737debad719c41cab16edb1435b2c721e07760a208c3
      SHOTS: ${{ github.workspace }}/iphone-screenshots
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Xcode 27.1 is the version EAS builds SDK 58 with. The newest iOS 27
      # runtime that has an iPhone 17 boots in the background meanwhile.
      - name: Xcode 27.1 and an iPhone 17
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version | grep -qx 'Xcode 27.1' || { xcodebuild -version; echo "::error::Xcode 27.1 is not on this image"; exit 1; }
          runtime=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.isAvailable and .platform == "iOS"
            and (.version | startswith("27.")) and any(.supportedDeviceTypes[]; .name == "iPhone 17"))]
            | sort_by(.version | split(".") | map(tonumber)) | last | .identifier // empty')
          [ -n "$runtime" ] || { xcrun simctl list runtimes; echo "::error::no iOS 27 runtime with an iPhone 17"; exit 1; }
          udid=$(xcrun simctl create ci-iphone com.apple.CoreSimulator.SimDeviceType.iPhone-17 "$runtime")
          echo "Booting an iPhone 17 on $runtime ($udid)"
          echo "UDID=$udid" >> "$GITHUB_ENV"
          nohup xcrun simctl boot "$udid" > "$RUNNER_TEMP/boot.log" 2>&1 &
      # The simulator shares the Mac's resolver: no published update can load.
      - name: Block published updates
        run: echo "0.0.0.0 u.expo.dev" | sudo tee -a /etc/hosts
      - name: Install AXe
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/axe.tar.gz" "$AXE_URL"
          echo "$AXE_SHA256  $RUNNER_TEMP/axe.tar.gz" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/axe"
          tar -xzf "$RUNNER_TEMP/axe.tar.gz" -C "$RUNNER_TEMP/axe"
          "$RUNNER_TEMP/axe/axe" --version
          [ -x "$PROVE_CHROME" ] || { echo "::error::no Chrome at $PROVE_CHROME"; exit 1; }
      - uses: ./.github/actions/setup-deps
      # The prove scripts' production build and fake-model instance, with the
      # lesson and quiz fixtures in its throwaway data folder.
      - name: Build and start the server
        run: |
          set -euo pipefail
          P=.claude/skills/prove-learnharness/scripts
          RUN=$($P/new-run.sh iphone)
          echo "RUN=$RUN" >> "$GITHUB_ENV"
          $P/build.sh "$RUN" head
          mkdir -p "$RUN/head/data/chats" "$RUN/head/data/jobs"
          cp tests/fixtures/mobile-lesson/chat_*.json tests/fixtures/mobile-quiz/chat_*.json "$RUN/head/data/chats/"
          cp tests/fixtures/mobile-lesson/job_*.json "$RUN/head/data/jobs/"
          INST=$($P/start.sh "$RUN" head "$PWD/tests/fixtures/mobile-quiz/scenario.json")
          echo "INST=$INST" >> "$GITHUB_ENV"
          . "$INST"
          scripts/iphone-check/tls-cert.sh "$RUNNER_TEMP/tls"
          port=$(node -e 'const s=require("net").createServer();s.listen(0,"127.0.0.1",()=>{console.log(s.address().port);s.close()})')
          nohup node scripts/iphone-check/tls-front.mjs "$port" "$APP_PORT" "$RUNNER_TEMP/tls/cert.pem" "$RUNNER_TEMP/tls/key.pem" > "$RUN/tls-front.log" 2>&1 &
          echo "ORIGIN=https://127.0.0.1:$port" >> "$GITHUB_ENV"
          curl -fsS --cacert "$RUNNER_TEMP/tls/ca.pem" --retry 10 --retry-connrefused --retry-delay 1 "https://127.0.0.1:$port/api/health" > /dev/null
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
        working-directory: apps/mobile
      # T3 Code's Debug simulator build (scripts/mobile-native-client.ts:722-766):
      # a clean prebuild, pod install, then one unsigned arm64 build. Debug
      # embeds no bundle, so the app can only run what Metro serves it.
      - name: Build the app
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          npx expo prebuild --clean --platform ios --no-install
          (cd ios && pod install)
          xcrun xcodebuild -workspace ios/LearnHarnessNightly.xcworkspace -scheme LearnHarnessNightly -configuration Debug \
            -destination "generic/platform=iOS Simulator" -derivedDataPath "$RUNNER_TEMP/dd" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO build -quiet
          app="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/LearnHarnessNightly.app"
          if [ -e "$app/main.jsbundle" ]; then echo "::error::the Debug app embeds a bundle"; exit 1; fi
          echo "APP=$app" >> "$GITHUB_ENV"
      - name: Install the app and start Metro
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl keychain "$UDID" add-root-cert "$RUNNER_TEMP/tls/ca.pem"
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4
          xcrun simctl install "$UDID" "$APP"
          (cd apps/mobile && nohup npx expo start --port 8081 > "$RUNNER_TEMP/metro.log" 2>&1 &)
          curl -fsS --retry 60 --retry-connrefused --retry-delay 2 http://127.0.0.1:8081/status
      - name: Drive the app and the web
        run: |
          node scripts/iphone-check/drive.mjs --udid "$UDID" --bundle com.maxmiller.learnharness.nightly --origin "$ORIGIN" \
            --instance "$INST" --out "$SHOTS" --axe "$RUNNER_TEMP/axe/axe" --chrome "$PROVE_CHROME" --metro-log "$RUNNER_TEMP/metro.log"
      - name: Job summary and logs
        if: always()
        run: |
          mkdir -p "$SHOTS/logs"
          if [ -f "$SHOTS/summary.md" ]; then cat "$SHOTS/summary.md" >> "$GITHUB_STEP_SUMMARY"; else echo "No screenshots summary: see the Drive step." >> "$GITHUB_STEP_SUMMARY"; fi
          cp "$RUNNER_TEMP/metro.log" "$SHOTS/logs/" 2>/dev/null || true
          if [ -n "${RUN:-}" ]; then cp "$RUN"/head/*.log "$RUN"/head/*.jsonl "$RUN"/*.log "$SHOTS/logs/" 2>/dev/null || true; fi
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iphone-screenshots
          path: ${{ env.SHOTS }}
          retention-days: 14
          if-no-files-found: error

  # The required status check for main. It fails when any other job fails, is
  # cancelled, or is skipped although `changes` said it was needed, so splitting
  # or resharding jobs needs no branch-protection change. Add every new job to
  # `needs`. `always()` rather than `!cancelled()`: a skipped job reports
  # success to branch protection, so a cancelled run must still fail here.
  check:
    name: Check
    if: ${{ always() }}
    needs: [changes, lint, typecheck, test, selfhost, standalone, mobile, iphone]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # A job may skip only when `changes` set its gate (keyed by job id) to false.
          echo "$RESULTS" | jq -e '.changes.outputs as $gates
            | all(to_entries[];
                .value.result == "success"
                or (.value.result == "skipped" and $gates[.key] == "false"))' > /dev/null
