name: Mobile release
run-name: Mobile release (${{ inputs.mode || github.event_name }})

# The only place phone builds and OTA updates come from: never a laptop.
# A merge publishes an OTA when the newest TestFlight build has the same
# runtime (the native fingerprint), and otherwise starts one build on Expo's
# servers that is sent to TestFlight. Monday refreshes a build before
# TestFlight's 90-day expiry. .github/scripts/mobile-release.cjs holds the
# rules; see docs/specs/mobile-auto-updates.md. Modeled on T3 Code's
# .github/workflows/mobile-eas-production.yml.
on:
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - src/client-protocol/**
      - src/core/**
      - build/icon.png
      - public/fonts/cmunbx.ttf
      - .github/workflows/mobile-release.yml
      - .github/scripts/mobile-release.cjs
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "check: read-only status. update: publish an OTA now. build: build and send to TestFlight."
        required: true
        type: choice
        default: check
        options:
          - check
          - update
          - build

permissions:
  contents: read
  actions: read

# GitHub keeps one pending run per group and cancels the older pending one.
# Each kind of run gets its own group, so a pending run is replaced only by a
# newer run of the same kind (a newer push contains the older one's commits).
# The "Wait for older runs" step serializes runs of different kinds.
concurrency:
  group: mobile-release-${{ github.event_name }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  release:
    name: Mobile release (${{ inputs.mode || github.event_name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Only main may use this environment, so other branches never get EXPO_TOKEN.
    environment: mobile-release
    env:
      EXPO_NO_TELEMETRY: "1"
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      MODE: ${{ inputs.mode }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      # Full history for the stale-commit check. No sparse checkout: eas-cli
      # archives the project with a shallow git clone of this checkout (T3 :137-140).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Refuse other refs and a missing token
        run: node ../../.github/scripts/mobile-release.cjs preflight

      # Runs that can build or publish go one at a time, in the order they
      # started (a re-run keeps its old ID but starts later). check only reads.
      - name: Wait for older runs
        if: inputs.mode != 'check'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          started="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)"
          while :; do
            older="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/mobile-release.yml/runs?per_page=100" \
              --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and .status != \"completed\"
                and (.run_started_at < \"$started\" or (.run_started_at == \"$started\" and .id < $GITHUB_RUN_ID))
                and (.display_title | endswith(\"(check)\") | not))] | length")"
            if [ "$older" -eq 0 ]; then break; fi
            echo "Waiting for $older older mobile release run(s)."
            sleep 20
          done

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      # eas-cli is an exact devDependency, so it installs from the lockfile.
      - run: npm ci

      # Everything up to the decision only reads. The runtime comes from the
      # same expo-updates resolution eas build and eas update use.
      - name: Runtime, config and Expo history
        run: |
          set -euo pipefail
          npx expo config --type public --json > "$RUNNER_TEMP/expo-config.json"
          node ../../.github/scripts/mobile-release.cjs check-config "$RUNNER_TEMP/expo-config.json" eas.json
          npx expo-updates runtimeversion:resolve --platform ios > "$RUNNER_TEMP/runtime.json"
          node ../../.github/scripts/mobile-release.cjs fetch "$RUNNER_TEMP/runtime.json" "$RUNNER_TEMP/state.json"

      - name: Decide
        id: decide
        run: |
          set -euo pipefail
          node ../../.github/scripts/mobile-release.cjs decide "$RUNNER_TEMP/runtime.json" "$RUNNER_TEMP/state.json" | tee -a "$GITHUB_OUTPUT"

      - name: Check
        if: steps.decide.outputs.action == 'check'
        env:
          RUNTIME: ${{ steps.decide.outputs.runtime }}
          PROBLEM: ${{ steps.decide.outputs.problem }}
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/state.json"
          group="$(jq -r '.latestUpdate.group // empty' "$state")"
          {
            echo "## Mobile release check"
            echo
            echo "- Runtime for main: \`$RUNTIME\`"
            jq -r '.builds[0] as $b | "- Newest build: " + (if $b == null then "none" else "\($b.appBuildVersion) (\($b.id)), build \($b.status), TestFlight upload \([$b.submissions[] | select(.platform == "IOS") | .status] | join(", ") | if . == "" then "none" else . end), runtime `\($b.runtime.version)`, matches main: \($b.runtime.version == env.RUNTIME), \($b.completedAt // $b.createdAt)" end)' "$state"
            jq -r '(.builds[0].runtime.version) as $r | .latestUpdate as $u | "- Newest update: " + (if $u == null then "none" else "group \($u.group), runtime `\($u.runtime.version)`, matches the newest build: \($u.runtime.version == $r), commit \($u.gitCommitHash), \($u.createdAt), \($u.message)" end)' "$state"
            if [ -n "$group" ]; then
              echo
              echo "### Launch records for that update group"
              echo
              echo '```'
              npx eas update:insights "$group" --platform ios --non-interactive
              echo '```'
            fi
            if [ -n "$PROBLEM" ]; then
              echo
              echo ":x: $PROBLEM"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          if [ -n "$PROBLEM" ]; then
            echo "::error::$PROBLEM"
            exit 1
          fi

      - name: Write the App Store Connect key
        if: steps.decide.outputs.action == 'build'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$APPLE_API_KEY" > "$RUNNER_TEMP/asc-api-key.p8"

      # --no-wait: the build and its TestFlight upload run on Expo's servers.
      # --freeze-credentials: a missing or expired certificate fails the build
      # instead of being replaced here.
      - name: Build and send to TestFlight
        if: steps.decide.outputs.action == 'build'
        env:
          ASC_API_KEY_PATH: ${{ runner.temp }}/asc-api-key.p8
          ASC_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
          BUILD_MESSAGE: ${{ steps.decide.outputs.message }}
          REASON: ${{ steps.decide.outputs.reason }}
        run: |
          set -euo pipefail
          npx eas build --platform ios --profile beta --auto-submit --freeze-credentials --no-wait --non-interactive --message "$BUILD_MESSAGE"
          echo ":building_construction: Started an iOS build and TestFlight upload: $REASON ($BUILD_MESSAGE)" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the App Store Connect key
        if: always()
        working-directory: ${{ runner.temp }}
        run: if [ -e "$RUNNER_TEMP/asc-api-key.p8" ]; then rm -- "$RUNNER_TEMP/asc-api-key.p8"; fi

      - name: Publish the OTA
        if: steps.decide.outputs.action == 'update'
        env:
          RUNTIME: ${{ steps.decide.outputs.runtime }}
        run: |
          set -euo pipefail
          message="$(git log -1 --pretty='%<(120,trunc)%s' | sed 's/ *$//') ($(git rev-parse --short=9 HEAD))"
          npx eas update --channel production --environment production --platform ios --message "$message" --non-interactive --json > "$RUNNER_TEMP/update.json"
          published="$(sed -n '/^\[/,$p' "$RUNNER_TEMP/update.json" | jq -r '[.[].runtimeVersion] | unique | join(",")')"
          if [ "$published" != "$RUNTIME" ]; then
            echo ":x: Published to runtime \`$published\`, but the decision checked \`$RUNTIME\`." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::eas update published to runtime $published, not $RUNTIME. Stop and report."
            exit 1
          fi
          echo ":white_check_mark: Published an OTA for runtime \`$RUNTIME\`: $message" >> "$GITHUB_STEP_SUMMARY"

      - name: Report
        if: steps.decide.outputs.action == 'none' || steps.decide.outputs.action == 'fail'
        env:
          ACTION: ${{ steps.decide.outputs.action }}
          REASON: ${{ steps.decide.outputs.reason }}
        run: |
          if [ "$ACTION" = fail ]; then
            echo ":x: $REASON" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$REASON"
            exit 1
          fi
          echo ":hourglass: Nothing to do: $REASON" >> "$GITHUB_STEP_SUMMARY"
