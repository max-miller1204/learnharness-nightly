name: Dependabot auto-merge

# Queues auto-merge (squash) on Dependabot's minor and patch PRs, so they merge
# once `Check` is green. Majors and anything touching Pi or typebox wait for an
# agent (a review round and prove-learnharness). The fork bot App token turns
# auto-merge on: a merge queued with the built-in token pushes to main without
# starting CI or the nightly. See docs/specs/dependency-updates.md.
#
# Needs FORK_BOT_CLIENT_ID and FORK_BOT_PRIVATE_KEY as Dependabot secrets
# (Dependabot runs can't read Actions secrets). See docs/fork-workflow.md.

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  auto-merge:
    name: Auto-merge
    # Only Dependabot's own pushes: a push by anyone else to a Dependabot
    # branch skips this, and only Dependabot runs get the Dependabot secrets.
    if: >-
      github.repository == 'max-miller1204/learnharness-nightly' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Read the update
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # main, not the PR: the token step below then runs main's copy of the
      # fork-bot-token action, never one a bot PR edited.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/fork-bot-token
        with:
          client-id: ${{ secrets.FORK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FORK_BOT_PRIVATE_KEY }}

      - name: Queue or hold the merge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          NAMES: ${{ steps.meta.outputs.dependency-names }}
        run: |
          set -euo pipefail
          reason=""
          case "$UPDATE_TYPE" in
            version-update:semver-minor | version-update:semver-patch) ;;
            *) reason="update type '${UPDATE_TYPE:-unknown}' is not minor or patch" ;;
          esac
          # Pi and typebox PRs need the plugin SDK files regenerated (spec, "Pi").
          if tr ',' '\n' <<< "$NAMES" | sed 's/^ *//; s/ *$//' | grep -qE '^(@earendil-works/.+|typebox)$'; then
            reason="it touches Pi or typebox"
          fi
          if [ -z "$reason" ]; then
            gh pr merge --auto --squash "$PR_URL"
            echo "Queued auto-merge: $UPDATE_TYPE ($NAMES)"
          else
            echo "Waiting for an agent: $reason ($NAMES)"
            # Holds a PR that a rebase turned ineligible. Fails harmlessly when
            # auto-merge was never on.
            gh pr merge --disable-auto "$PR_URL" 2> /dev/null || true
          fi
