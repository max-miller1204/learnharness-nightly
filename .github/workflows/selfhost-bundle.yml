name: Self-hosted bundle

# Builds and smoke-tests the self-hosted server archive for linux-x64 and
# linux-arm64 from one commit, and uploads each as the `selfhost-<arch>`
# artifact. Called by nightly.yml and pr-preview.yml, so a PR preview gets
# exactly the nightly's build and gates (docs/specs/pr-previews.md).
#
# It runs PR code in pr-preview.yml: it references no secrets, keeps no git
# credentials, and only reads with the token its caller grants (read-only).

on:
  workflow_call:
    inputs:
      sha:
        description: "Commit to build"
        type: string
        required: true
      version:
        description: "Exact version baked into the build (LH_VERSION)"
        type: string
        required: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  FORK_HOMEPAGE: https://github.com/${{ github.repository }}

jobs:
  bundle:
    name: Bundle (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: linux-x64
            node_arch: x64
          - runner: ubuntu-24.04-arm
            arch: linux-arm64
            node_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run plugins:setup
      - run: npm run build
        env:
          LH_VERSION: ${{ env.VERSION }}
          LH_HOMEPAGE: ${{ env.FORK_HOMEPAGE }}
      # Same gates as CI and the desktop release, on the host Node.
      - run: node scripts/smoke-provider-runtime.mjs
      - run: node scripts/build-server.mjs
      - run: node scripts/smoke-server.mjs
      - name: Download the Node runtime that ships in the archive
        run: |
          nv=$(node -p process.version)
          file="node-${nv}-linux-${{ matrix.node_arch }}.tar.xz"
          cd "$RUNNER_TEMP"
          curl -fsSLO --retry 3 "https://nodejs.org/dist/${nv}/${file}"
          curl -fsSLO --retry 3 "https://nodejs.org/dist/${nv}/SHASUMS256.txt"
          grep " ${file}\$" SHASUMS256.txt | sha256sum -c -
          tar -xJf "$file"
          echo "NODE_DIR=$RUNNER_TEMP/node-${nv}-linux-${{ matrix.node_arch }}" >> "$GITHUB_ENV"
      - name: Assemble the archive
        run: node selfhost/scripts/package-archive.ts --version "$VERSION" --arch "${{ matrix.arch }}" --node-dir "$NODE_DIR" --standalone .next/standalone --out dist-selfhost
      - name: Smoke the assembled archive with its bundled Node
        run: |
          dir="$RUNNER_TEMP/archive"
          mkdir -p "$dir"
          tar -xzf "dist-selfhost/learnharness-${VERSION}-${{ matrix.arch }}.tar.gz" -C "$dir"
          "$dir/lh" __selftest --expect-version "$VERSION"
      - name: Launcher tests on this arch
        run: node --test selfhost/tests/*.test.ts
      - uses: actions/upload-artifact@v7
        with:
          name: selfhost-${{ matrix.arch }}
          path: dist-selfhost/*
          if-no-files-found: error
          retention-days: 7
